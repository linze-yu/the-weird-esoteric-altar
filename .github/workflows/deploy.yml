name: 部署冰山图

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'tools/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 依赖
        run: pip install fonttools brotli

      - name: 从 wiki 原文重建词条数据
        run: |
          python3 tools/extract_entries.py wiki/entities/cbaigui site/entries.json
          python3 tools/optimize_site.py .

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
